name: CI

# Runs on the standalone snapWONDERS Report repo (this file becomes .github/workflows/ci.yml there
# when the package is mirrored, see docs/ops/SDK_PUBLISHING.md). Offline tests need no API key.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test — Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18.x", "20.x", "22.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Offline test suite
        run: npm test
      - name: Verify publishable contents
        run: npm pack --dry-run
